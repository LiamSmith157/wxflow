version: '3.1'

services:
    redis:
        image: redis:alpine
        container_name: wxflow-redis
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        networks:
            - wxflow-net

    wxflow:
        container_name: wxflow-main
        build:
            context: .. # Build using the Dockerfile in the root directory
            dockerfile: docker/Dockerfile
        ports:
            - '${PORT}:${PORT}'
        volumes:
            # Mount local .wxflow to container's default location.
            # Container runs as the non-root `node` user, whose home is /home/node.
            # Ensure the host directory is writable by that user (e.g. `chown -R 1000:1000 ../.wxflow` on Linux hosts).
            - ../.wxflow:/home/node/.wxflow
        environment:
            # --- Essential wxflow Vars ---
            - PORT=${PORT:-3000}
            - DATABASE_PATH=/home/node/.wxflow
            - SECRETKEY_PATH=/home/node/.wxflow
            - LOG_PATH=/home/node/.wxflow/logs
            - BLOB_STORAGE_PATH=/home/node/.wxflow/storage
            # --- Queue Vars (Main Instance) ---
            - MODE=queue
            - QUEUE_NAME=wxflow-queue # Ensure this matches worker
            - REDIS_URL=redis://redis:6379 # Use service name 'redis'
        depends_on:
            - redis
        networks:
            - wxflow-net

    wxflow-worker:
        container_name: wxflow-worker
        build:
            context: .. # Build context is still the root
            dockerfile: docker/worker/Dockerfile # Ensure this path is correct
        volumes:
            # Mount same local .wxflow to worker.
            # Container runs as the non-root `node` user, whose home is /home/node.
            - ../.wxflow:/home/node/.wxflow
        environment:
            # --- Essential wxflow Vars ---
            - WORKER_PORT=${WORKER_PORT:-5566} # Port for worker healthcheck
            - DATABASE_PATH=/home/node/.wxflow
            - SECRETKEY_PATH=/home/node/.wxflow
            - LOG_PATH=/home/node/.wxflow/logs
            - BLOB_STORAGE_PATH=/home/node/.wxflow/storage
            # --- Queue Vars (Main Instance) ---
            - MODE=queue
            - QUEUE_NAME=wxflow-queue # Ensure this matches worker
            - REDIS_URL=redis://redis:6379 # Use service name 'redis'
        depends_on:
            - redis
            - wxflow
        networks:
            - wxflow-net

volumes:
    redis_data:
        driver: local

networks:
    wxflow-net:
        driver: bridge
